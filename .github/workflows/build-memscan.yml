name: build-memscan
on:
  push:
    paths:
      - '2memscan-mod*.zip'
      - '.github/workflows/build-memscan.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf work && mkdir -p work
          unzip -oq "$(ls 2memscan-mod*.zip | head -n1)" -d work
          ls work/memscan-mod
      - name: Setup NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018 cmake;3.31.6
      - name: Configure
        run: |
          cmake -S work/memscan-mod -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/android --target memscan
      - name: Package .levipack
        run: |
          mkdir -p dist/memscan
          cp work/memscan-mod/manifest.json dist/memscan/
          cp build/android/libmemscan.so dist/memscan/
          (cd dist/memscan && zip -r ../../memscan.levipack .)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memscan-levipack
          path: memscan.levipack
