name: build-nofall
on:
  push:
    paths:
      - 'nofalldamage-mod*.zip'
      - '.github/workflows/build-nofall.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q "$(ls nofalldamage-mod*.zip | head -n1)" -d work
      - name: Setup NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018 cmake;3.31.6
      - name: Configure
        run: |
          cmake -S work/nofalldamage-mod -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/android --target nofalldamage
      - name: Package .levipack
        run: |
          mkdir -p dist/nofalldamage
          cp work/nofalldamage-mod/manifest.json dist/nofalldamage/
          cp build/android/libnofalldamage.so dist/nofalldamage/
          (cd dist/nofalldamage && zip -r ../../nofalldamage.levipack .)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nofalldamage-levipack
          path: nofalldamage.levipack
