name: Build NoFallDamage Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-21
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Mod
        run: |
          mkdir -p mod_package
          cp manifest.json mod_package/
          cp build/libnofalldamage.so mod_package/
          cd mod_package
          zip -r ../NoFallDamageMod.levipack .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoFallDamageMod
          path: NoFallDamageMod.levipack
